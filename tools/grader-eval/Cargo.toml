[workspace]

[package]
name = "idiosepius-grader-eval"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Blocking + rustls keeps this a pure-Rust build: no OpenSSL, no cmake, no
# libclang, no shaderc. That is the point of dropping the bundled llama.cpp —
# the harness builds with a stock cargo and needs no nix shell of its own.
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }

