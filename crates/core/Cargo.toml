[package]
name = "idiosepius-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
rand = "0.10.2"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror = "2.0.19"
time = { version = "0.3.54", features = ["formatting", "parsing", "macros", "local-offset"] }
tokio = { version = "1.53.1", default-features = false, features = ["rt"] }
web-time = "1.1.0"
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
turso = { version = "0.8.0-pre.1", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
turso_core = { version = "0.8.0-pre.1", default-features = false, features = ["fs", "json", "time", "uuid"] }
uuid = { version = "1", features = ["js"] }
