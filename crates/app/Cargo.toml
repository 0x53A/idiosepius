[package]
name = "idiosepius-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["audio"]
# The background soundscape, and with it the whole Apteronotus synthesis
# engine. Enabled by default because the feature is part of the app; kept
# separable because it is the only thing in the tree that opens an audio
# device, links a host audio stack, or depends on another repository —
# `--no-default-features` builds a study app with none of that.
audio = ["dep:apteronotus-live", "dep:apteronotus-lua", "dep:apteronotus-songs"]

[dependencies]
anyhow.workspace = true
apteronotus-live = { workspace = true, optional = true }
apteronotus-lua = { workspace = true, optional = true }
apteronotus-songs = { workspace = true, optional = true }
idiosepius-core = { version = "0.1.0", path = "../core" }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rand = "0.10.2"
resvg = { version = "0.45.1", default-features = false, features = ["text"] }
serde.workspace = true
serde_json.workspace = true
skrifa = "0.42"
web-time = "1.1.0"
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = "0.35.0"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
ureq = { version = "3", features = ["json"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
egui_web_component = { git = "https://github.com/0x53A/web-component-rs.git", rev = "dd67eb777ad7af07d7e86888dea2731c0afe048d" }
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow"] }
js-sys = "0.3"
log = "0.4"
rust_web_component = { git = "https://github.com/0x53A/web-component-rs.git", rev = "dd67eb777ad7af07d7e86888dea2731c0afe048d" }
rust_web_component_macro = { git = "https://github.com/0x53A/web-component-rs.git", rev = "dd67eb777ad7af07d7e86888dea2731c0afe048d" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "console",
    "HtmlElement",
] }
