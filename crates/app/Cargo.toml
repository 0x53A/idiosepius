[package]
name = "idiosepius-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
idiosepius-core = { version = "0.1.0", path = "../core" }
image = { version = "0.25.10", default-features = false, features = ["png"] }
resvg = { version = "0.45.1", default-features = false, features = ["text"] }
serde_json.workspace = true
web-time = "1.1.0"
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = "0.35.0"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
ureq = { version = "3", features = ["json"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
egui_web_component = { git = "https://github.com/0x53A/web-component-rs.git", rev = "dd67eb777ad7af07d7e86888dea2731c0afe048d" }
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow"] }
js-sys = "0.3"
log = "0.4"
rust_web_component = { git = "https://github.com/0x53A/web-component-rs.git", rev = "dd67eb777ad7af07d7e86888dea2731c0afe048d" }
rust_web_component_macro = { git = "https://github.com/0x53A/web-component-rs.git", rev = "dd67eb777ad7af07d7e86888dea2731c0afe048d" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "console",
    "HtmlElement",
] }
